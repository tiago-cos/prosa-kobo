openapi: 3.1.0
info:
  version: 0.1.0
  title: Prosa-Kobo
  contact:
    name: Tiago Sousa
    email: tiago.costa.sousa@proton.me
    url: https://github.com/tiago-cos
  license:
    name: MIT
    url: https://opensource.org/license/MIT

  description: |
    The HTTP API of [Prosa-Kobo](https://github.com/tiago-cos/prosa-kobo), which
    connects Kobo eReaders to [Prosa](https://github.com/tiago-cos/prosa).

    Installing it, configuring it and connecting a Kobo are covered in the
    [wiki](https://github.com/tiago-cos/prosa-kobo/wiki). This document is the
    reference for the endpoints that link and unlink devices. The endpoints the
    Kobo itself calls imitate Kobo's own servers and are not described here.

    ## Authentication

    These endpoints take a Prosa JWT, `Authorization: Bearer <token>`, from
    Prosa's `/auth/login`. A user may act only on their own devices; a Prosa
    admin may act on anyone's, and is the only one who may list devices without
    filtering by user.

    Linking a device binds it to a Prosa API key and returns its endpoint. That
    endpoint ends in a secret path segment, which is the device's only
    credential: every request the Kobo makes arrives under it. Nothing expires;
    unlinking the device revokes it.

externalDocs:
  description: "Checkout the project repository for more information."
  url: "https://github.com/tiago-cos/prosa-kobo"

tags:
  - name: Devices
    description: Linking Kobo devices to Prosa API keys, listing them and unlinking them.

x-tagGroups:
  - name: API Specification
    tags:
      - Devices
      
security:
  - prosaToken: []

servers:
  - url: http://{host}
    variables:
      host:
        default: localhost
        description: The server host
        
paths:
  /devices/linked:
    $ref: "paths/devices/linked.yaml"
  /devices/linked/{device_id}:
    $ref: "paths/devices/linked/{device_id}.yaml"

components:
  securitySchemes:
    prosaToken:
      description: "Prosa user authentication JWT."
      type: http
      scheme: bearer
      bearerFormat: JWT