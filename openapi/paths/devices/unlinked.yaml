get:
  tags:
    - Devices
  summary: List unlinked devices
  description: |
    Retrieves a list of all devices that have contacted the middleware but are not yet linked to a user account.

    A device drops off this list once `devices.unlinked_expiration` has passed
    since it made contact, and reappears the next time it tries to sync.

    Any valid Prosa token may read this list.
  operationId: list_unlinked_devices

  responses:
    '200':
      description: A list of unlinked devices.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/DeviceLog.yaml
    '401':
      description: The Prosa token is missing, malformed, expired, or not signed by Prosa.
