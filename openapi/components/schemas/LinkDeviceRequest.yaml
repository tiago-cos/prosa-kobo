type: object
properties:
  name:
    type: string
    description: A name for the device, shown when listing linked devices.
    example: Bedside Kobo
  api_key:
    type: string
    description: Prosa API key the device's requests will be translated with.
    example: uXl248ck5oWd9uXl248c5oWd9uXl2
  user_id:
    type: string
    format: uuid
    description: |
      _(Optional)_ The Prosa user to link the device to. Defaults to the user
      the token belongs to. Only admins may name another user.
    example: 14ae396c-07c3-437d-a0a0-ef48189ba40a
required:
  - name
  - api_key
