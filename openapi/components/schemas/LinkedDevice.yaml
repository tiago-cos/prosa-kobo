type: object
properties:
  device_id:
    type: string
    description: Identifies the device to the management endpoints.
    example: 8Nn3sBOoRdSK5xUlpEDdxA
  user_id:
    type: string
    format: uuid
    description: The Prosa user the device is linked to.
    example: 14ae396c-07c3-437d-a0a0-ef48189ba40a
  name:
    type: string
    description: The name the device was linked under.
    example: Bedside Kobo
required:
  - device_id
  - user_id
  - name
