[package]
name = "prosa-kobo"
version = "0.1.0"
edition = "2024"
include = ["src/**/*"]

[features]
# Exposes the in-memory Prosa client used by tests.
mock = ["dep:uuid"]

[dependencies]
axum = "0.8.9"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
config = "0.15.26"
image = "0.25.10"
isolang = "2.4.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
kepub-rs = "0.1.1"
log = "0.4.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = "1.0.229"
serde_json = "1.0.151"
serde_with = "3.23.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
strum = "0.28.0"
strum_macros = "0.28.0"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
uuid = { version = "1.26.1", optional = true }

[dev-dependencies]
prosa-kobo = { path = ".", features = ["mock"] }
regex = "1.13.1"
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.26.1", features = ["v4"] }
zip = "8.6.0"
