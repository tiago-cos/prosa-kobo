[package]
name = "prosa-kobo"
version = "0.1.0"
edition = "2024"
include = ["src/**/*"]

[features]
# Exposes the in-memory Prosa client used by tests.
mock = ["dep:uuid"]

[dependencies]
axum = "0.8.6"
axum-extra = "0.10.3"
async-trait = "0.1.92"
base64 = "0.22.1"
chrono = "0.4.42"
config = "0.15.18"
image = "0.25.8"
isolang = "2.4.0"
jsonwebtoken = { version = "10.0.0", default-features = false, features = ["aws_lc_rs"] }
kepub-rs = "0.1.1"
log = "0.4.28"
rand = "0.9.2"
regex = "1.11.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = "1.0.228"
serde_json = "1.0.145"
serde_with = "3.15.0"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
strum = "0.27.2"
strum_macros = "0.27.2"
tokio = { version = "1.47.1", features = ["full"] }
tower = { version = "0.5.3", default-features = false }
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "chrono"] }
urlencoding = "2.1.3"
uuid = { version = "1.26.0", optional = true }

[dev-dependencies]
image = "0.25.8"
prosa-kobo = { path = ".", features = ["mock"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.26.0", features = ["v4"] }
zip = "8.6.0"
