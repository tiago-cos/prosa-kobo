[server.bind]
host = "0.0.0.0"
port = 5001

# The address the Kobo reaches prosa-kobo at. Without it, the device is sent
# back over http to the host and port it addressed. Set it behind a reverse
# proxy, where the device's scheme and port are the proxy's.

# [server.public]
# scheme = "https"
# host = "books.example.com"
# port = 443

[database]
file_path = "persistence/database.db"
# Size of the SQLite connection pool.
max_connections = 16
# How long a statement waits for a contended write before failing.
busy_timeout_seconds = 10
# Snapshot the database (VACUUM INTO) before applying or reverting migrations.
backup_before_migration = true

[prosa]
scheme = "http"
host = "127.0.0.1"
port = 5000

[kepub]
cache_size_mb = 256
