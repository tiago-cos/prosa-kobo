name: Publish Wiki

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish wiki/ to the GitHub wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone wiki repository
        run: |
          git clone \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            wiki-repo

      - name: Replace pages
        run: |
          find wiki-repo -maxdepth 1 -name '*.md' -delete
          cp wiki/*.md wiki-repo/

      - name: Commit and push
        working-directory: wiki-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "Wiki already matches wiki/; nothing to publish."
            exit 0
          fi

          git commit -m "docs: publish wiki from ${GITHUB_SHA::7}"
          git push
