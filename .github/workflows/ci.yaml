name: Prosa-Kobo CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      src_or_tests: ${{ steps.filter.outputs.src_or_tests }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src_or_tests:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  lint:
    name: Lint Rust
    runs-on: ubuntu-latest
    needs: changes

    if: needs.changes.outputs.src_or_tests == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Rust format
        run: cargo fmt -- --check

      - name: Rust lint
        run: cargo clippy --all-targets --all-features -- -W clippy::pedantic -D warnings

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: changes

    if: needs.changes.outputs.src_or_tests == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test
